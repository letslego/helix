apiVersion: apps/v1
kind: Deployment
metadata:
  name: helix
  namespace: helix
  labels:
    app: helix
spec:
  replicas: 1
  selector:
    matchLabels:
      app: helix
  template:
    metadata:
      labels:
        app: helix
      annotations:
        helix.io/policy-sidecar: "true"
    spec:
      serviceAccountName: helix
      securityContext:
        runAsNonRoot: true
        fsGroup: 10001
      containers:
        - name: helix
          image: ghcr.io/letslego/helix:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: HELIX_CONTEXT_MODE
              value: hybrid
            - name: HELIX_POLICY_SIDECAR_URL
              value: http://127.0.0.1:8181
            - name: HELIX_TENANT_HEADER
              value: x-helix-tenant
            - name: HELIX_BIND_HOST
              value: "0.0.0.0"
            - name: HELIX_AGENT_DIR
              value: /data/agent-project
            - name: PORT
              value: "8080"
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: helix-state
              mountPath: /data/agent-project/.helix
            - name: org-context
              mountPath: /data/agent-project/agent/context/org.md
              subPath: org.md
              readOnly: true
            - name: org-context
              mountPath: /data/agent-project/agent/context/tenants/acme.md
              subPath: acme.md
              readOnly: true
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            capabilities:
              drop:
                - ALL

        - name: policy-sidecar
          image: ghcr.io/letslego/helix-policy-sidecar:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: policy
              containerPort: 8181
          env:
            - name: PORT
              value: "8181"
            - name: HELIX_POLICY_PACKS_DIR
              value: /policies
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: policy-packs
              mountPath: /policies
              readOnly: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: policy
            initialDelaySeconds: 1
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: policy
            initialDelaySeconds: 2
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10002
            capabilities:
              drop:
                - ALL

      volumes:
        - name: tmp
          emptyDir: {}
        - name: helix-state
          emptyDir: {}
        - name: org-context
          configMap:
            name: helix-org-context
        - name: policy-packs
          configMap:
            name: helix-policy-packs
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: helix
  namespace: helix
---
apiVersion: v1
kind: Service
metadata:
  name: helix
  namespace: helix
spec:
  selector:
    app: helix
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: helix-policy-sidecar-localhost
  namespace: helix
spec:
  podSelector:
    matchLabels:
      app: helix
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - namespaceSelector: {}
    # Sidecar is reached via localhost loopback (not subject to NetPol pod selectors).
